# ===== 统一异常提示 =====
errorReporter.unknown=未知错误
errorReporter.userDetail={0}：{1}
errorReporter.userDetailWithHint={0}：{1}\n详细信息已写入日志。
errorReporter.global=程序发生未预期错误：{0}\n详细信息已写入日志。
errorReporter.dialogTitle=nginxUI
