# nginxUI 中文文案(默认兜底)
app.name=nginxUI

# ===== 实例发现 =====
dash.unknownInstance=未知实例 (PID {0})
dash.unresolvedInstance=无法解析该实例的可执行文件/配置路径（可能由 Windows 服务账户托管），仅显示进程信息
dash.duplicateMaster=配置 {0} 存在 {1} 个 master 进程（PID {2}），属于重复启动，仅一个能成功绑定端口
dash.versionMismatch=多个实例 Nginx 版本不一致：{0}
dash.instanceStopped=实例「{0}」已停止（{1}）
dash.orphanProcesses=存在 {0} 个无法归属到任何实例的 nginx 进程（PID {1}），可能是异常残留
dash.listenConflict=监听端口 {0} 被多个实例同时声明：{1}{2}
dash.listenWildcard=（含通配地址，必有实例启动失败）
dash.stubNotEnabled=stub_status 未启用（监控端口 {0} 不在本实例配置中）
dash.stubMonitorOff=已关闭该实例的 stub_status 监控采集（配置中的监控块保持不变）

# ===== 实例控制 =====
dash.control.alreadyRunning=实例已在运行
dash.control.startOk=启动成功
dash.control.startWarning=启动成功, 但启动前配置检测未通过: {0}(实例已启动, 请尽快检查配置)
dash.control.alreadyStopped=实例已处于停止状态
dash.control.stopOk=已停止
dash.control.restartOk=重启成功
dash.control.restartWarning=重启成功, 但启动前配置检测未通过: {0}(实例已启动, 请尽快检查配置)
dash.control.logHint=，请检查 nginx 日志(logs/error.log)
dash.control.preflightSuffix=；启动前配置检测结果: {0}
dash.control.errorLogSuffix=；error.log 尾部: {0}

# ===== Windows 服务控制 =====
dash.service.verbStart=启动
dash.service.verbRestart=重启
dash.service.alreadyRunning=服务已在运行
dash.service.alreadyStopped=服务已处于停止状态
dash.service.stopOk=服务已停止
dash.service.actionOk=服务{0}成功
dash.service.actionWarning=服务{0}成功, 但启动前配置检测未通过: {1}(实例已启动, 请尽快检查配置)
dash.service.starting=服务正在启动中(上次崩溃后的状态切换可能尚未完成), 请等待几秒后重试
dash.service.crashBase=服务{0}后立即退出(nginx 子进程崩溃, 常见于退出码255/异常0xc0000409)
dash.service.crashSockapi=: 该实例是 sockapi 改版 nginx, 其全局共享套接字区(nginx_shared_sockets_zone)在同一台机器上同一时刻只允许一个实例持有; 当前持有者: {0}。请先停止对方再启动本实例(这是该改版的单实例机制限制, 不是配置语法问题)
dash.service.crashWrapper=; 包装器输出: {0}
dash.service.crashLog=; error.log 尾部: {0}
dash.service.peerFallback=(可能在其他会话运行或刚退出, 可在任务管理器确认其他 nginx_basic.exe)
dash.service.peerProcess=pid {0} ({1})
dash.service.peerService=服务 {0} ({1})

# ===== 配置维护 =====
dash.stub.unidentified=(未识别)
dash.config.noOutput=(无输出)
dash.config.failedReason=配置检测未通过

# ===== 统一错误码 =====
error.NEX-1001=实例配置文件不存在: {0}
error.NEX-1002=nginx 可执行文件不存在: {0}
error.NEX-1003=配置检测未通过: {0}
error.NEX-1004=配置检测执行异常: {0}
error.NEX-1005=当前 nginx 未编译 http_stub_status_module 模块, 无法生成监控配置; 请升级 nginx 或重新编译时添加 --with-http_stub_status_module
error.NEX-1006=9527 起连续20个端口均被占用, 无法生成 stub_status 监控配置
error.NEX-1007=实例配置中未找到 http 块, 无法写入 stub_status 监控块
error.NEX-1008=该实例配置中没有由本系统写入的 stub_status 监控块, 无需移除（手工声明的块不受本操作影响）
error.NEX-1009=操作异常: {0}
error.NEX-1010=不支持的操作: {0}
