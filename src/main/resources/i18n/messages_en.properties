# nginxUI English messages
app.name=nginxUI

# ===== Instance discovery =====
dash.unknownInstance=Unknown instance (PID {0})
dash.unresolvedInstance=Cannot resolve the executable/configuration path of this instance (it may be hosted by a Windows service account); only process information is shown
dash.duplicateMaster=Configuration {0} has {1} master processes (PID {2}); this is a duplicate start and only one can bind the port
dash.versionMismatch=Instances are running different Nginx versions: {0}
dash.instanceStopped=Instance "{0}" is stopped ({1})
dash.orphanProcesses={0} nginx processes cannot be attributed to any instance (PID {1}); they may be leftovers
dash.listenConflict=Listen port {0} is declared by multiple instances: {1}{2}
dash.listenWildcard= (includes a wildcard address, so some instance must fail to start)
dash.stubNotEnabled=stub_status is not enabled (monitor port {0} is not declared by this instance)
dash.stubMonitorOff=stub_status monitoring is disabled for this instance (the configuration block is kept unchanged)

# ===== Instance control =====
dash.control.alreadyRunning=Instance is already running
dash.control.startOk=Started successfully
dash.control.startWarning=Started successfully, but the pre-start configuration check failed: {0} (the instance is running, please review the configuration)
dash.control.alreadyStopped=Instance is already stopped
dash.control.stopOk=Stopped
dash.control.restartOk=Restarted successfully
dash.control.restartWarning=Restarted successfully, but the pre-start configuration check failed: {0} (the instance is running, please review the configuration)
dash.control.logHint=; please check the nginx log (logs/error.log)
dash.control.preflightSuffix=; pre-start configuration check: {0}
dash.control.errorLogSuffix=; tail of error.log: {0}

# ===== Windows service control =====
dash.service.verbStart=start
dash.service.verbRestart=restart
dash.service.alreadyRunning=Service is already running
dash.service.alreadyStopped=Service is already stopped
dash.service.stopOk=Service stopped
dash.service.actionOk=Service {0} succeeded
dash.service.actionWarning=Service {0} succeeded, but the pre-start configuration check failed: {1} (the instance is running, please review the configuration)
dash.service.starting=The service is starting (the state transition after the previous crash may not be complete); please wait a few seconds and retry
dash.service.crashBase=The service exited immediately after {0} (the nginx child process crashed, commonly exit code 255 / exception 0xc0000409)
dash.service.crashSockapi=: this is a sockapi build of nginx, whose global shared socket zone (nginx_shared_sockets_zone) allows only one instance on a machine at a time; current holder: {0}. Stop the other instance before starting this one (this is a single-instance restriction of that build, not a configuration syntax error)
dash.service.crashWrapper=; wrapper output: {0}
dash.service.crashLog=; tail of error.log: {0}
dash.service.peerFallback=(it may be running in another session or has just exited; check other nginx_basic.exe processes in Task Manager)
dash.service.peerProcess=pid {0} ({1})
dash.service.peerService=service {0} ({1})

# ===== Configuration =====
dash.stub.unidentified=(not detected)
dash.config.noOutput=(no output)
dash.config.failedReason=Configuration check failed

